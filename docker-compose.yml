x-repl-env: &repl-env
  REPL_USER: repl_user
  REPL_PASSWORD: repl_pass

services:
  postgres_main:
    build:
      context: .
      target: main
    container_name: pg_main_container
    environment:
      <<: *repl-env
      POSTGRES_USER: pos_us
      POSTGRES_PASSWORD: pos_pass
      POSTGRES_DB: priv_main_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5430:5432"
    volumes:
      - ./pgdata_main:/var/lib/postgresql/data/pgdata
      - ./sql/shared:/etc/sql/shared:ro
      - ./sql/main:/etc/sql/node:ro
      - ./sql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c max_connections=100
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c shared_preload_libraries=pg_cron
               -c cron.database_name=priv_main_db
               -c wal_level=logical
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U pos_us -d priv_main_db" ]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true

  postgres_replica:
    build:
      context: .
      target: replica
    container_name: pg_replica_container
    depends_on:
      postgres_main:
        condition: service_healthy
    environment:
      <<: *repl-env
      POSTGRES_USER: pos_us
      POSTGRES_PASSWORD: pos_pass
      POSTGRES_DB: priv_replica_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5431:5432"
    volumes:
      - ./pgdata_replica:/var/lib/postgresql/data/pgdata
      - ./sql/shared:/etc/sql/shared:ro
      - ./sql/replica:/etc/sql/node:ro
      - ./sql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c max_connections=100
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pos_us -d priv_replica_db" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
  